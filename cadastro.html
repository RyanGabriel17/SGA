<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/cadastro.css">
</head>
<body>

    <form>

        <div>
        <h1>Cadastre-se</h1>

        <label for="c1">Nome Completo:</label>
        <input type="text" id="c1" placeholder="Nome completo">

        <br><br><label for="c2">Email:</label>
        <input type="email" id="c2" placeholder="Email">

        <br><br><label for="c3">Disciplina:</label>
        <input type="text" id="c3" placeholder="Disciplina principal">

        <br><br><label for="c4">Senha:</label>
        <input type="password" id="c4" placeholder="Senha">

        <br><br><label for="c5">Confirmar Senha:</label>
        <input type="password" id="c5" placeholder="Confirmar Senha">

        <button type="submit">Cadastrar</button>

        <p>Já tem uma conta? <a href="/index.html">Faça Login</a></p>
        </div>
    </form>
    
</body>
</html>
