<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Professor - SGA</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <main class="container">

        <div class="circulo esquerda"></div>
        <div class="circulo direita"></div>

        <section class="cadastro">
            <h1>Criar conta do professor</h1>

            <form id="formCadastro">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome"
                       placeholder="Seu nome completo" required>

                <label for="email">E-mail institucional</label>
                <input type="email" id="email"
                       placeholder="seuemail@instituicao.edu.br" required>

                <label for="disciplina">Disciplina principal</label>
                <input type="text" id="disciplina" placeholder="Disciplina principal" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha"
                       placeholder="Digite sua senha" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar"
                       placeholder="Confirme sua senha" required>

                <p id="mensagem"></p>

                <button type="submit">Cadastrar</button>

            </form>
        </section>

    </main>

    <script src="cadastro.js"></script>
</body>
</html>
