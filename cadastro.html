<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Gestão Acadêmica</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="background-shape"></div>

    <div class="card-container">
        <h1>Sistema de Gestão<br>Acadêmica</h1>
        <div class="divider"></div>
        <h2>Cadastre-se</h2>

        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" placeholder="Digite seu Nome Completo" required>
            </div>

            <div class="input-group">
                <label for="email">Email Institucional:</label>
                <input type="email" id="email" placeholder="Digite seu Email" required>
            </div>

            <div class="input-group">
                <label for="disciplina">Disciplina:</label>
                <input type="text" id="disciplina" placeholder="Disciplina principal" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua Senha" required>
            </div>

            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha:</label>
                <input type="password" id="confirmarSenha" placeholder="Confirme sua Senha" required>
            </div>

            <button type="submit">Cadastrar</button>

            <p id="mensagem"></p>

            <p class="login-link">
                Já tem uma conta? <a href="index.html">Faça Login</a>
            </p>
        </form>
    </div>

    <script src="cadastro.js"></script>

</body>
</html>
