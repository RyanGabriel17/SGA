<!DOCTYPE html>  <html lang="pt-br">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Login - SGA</title>  
    <link rel="stylesheet" href="login.css">  
</head>  
<body>  <main class="container">  

    <!-- Logo do sistema -->  
    <div class="logo">  
        <h1>SGA</h1>  
        <span></span>  
        <p>SISTEMA DE<br>GESTÃO ACADÊMICA</p>  
    </div>  

    <!-- Fundo decorativo -->  
    <div class="fundo">  
        <div class="onda onda1"></div>  
        <div class="onda onda2"></div>  
    </div>  

    <!-- Formulário de login -->  
    <section class="login">  

        <h2>Faça o seu login</h2>  
        <div class="linha"></div>  

        <form id="loginForm">  

            <!-- E-mail -->  
            <div class="campo">  
                <label for="email">Seu e-mail*</label>  
                <input  
                    type="email"  
                    id="email"  
                    name="email"  
                    placeholder="Digite seu e-mail"  
                    required  
                >  
            </div>  

            <!-- Senha -->  
            <div class="campo">  
                <label for="senha">Sua senha*</label>  
                <input  
                    type="password"  
                    id="senha"  
                    name="senha"  
                    placeholder="Digite sua senha"  
                    required  
                >  
            </div>  

            <!-- Lembrar-me -->  
            <div class="lembrar">  
                <input  
                    type="checkbox"  
                    id="lembrar"  
                    name="lembrar"  
                >  
                <label for="lembrar">Lembrar-me</label>  
            </div>  

            <!-- Botão entrar -->  
            <button type="submit" class="botao-entrar">  
                ENTRAR  
            </button>  

            <!-- Recuperação de senha -->  
            <p class="esqueceu">  
                Esqueceu sua senha?  
                <a href="#">Clique aqui!</a>  
            </p>  

            <!-- Botão criar conta -->  
            <a href="cadastro.html" class="botao-cadastro">  
                Criar conta  
            </a>  

            <!-- Mensagem de validação -->  
            <p id="mensagem"></p>  

        </form>  

    </section>  

</main>  

<script src="login.js"></script>

</body>  
</html>
