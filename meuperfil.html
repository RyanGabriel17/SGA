<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu perfil - SGA</title>

    <link rel="stylesheet" href="meuperfil.css">
    <link rel="stylesheet" href="sidebar-toggle.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             MENU LATERAL
        ========================== -->

        <aside class="sidebar" id="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    <img src="imagens/logo-faculdade.png" alt="Logo da faculdade">
                </div>

                <div>
                    <h2>SGA</h2>
                    <span>Docente</span>
                </div>

            </div>

            <nav>

                <a href="menu.html" aria-label="Minhas turmas" title="Minhas turmas">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14M3 18V5a2 2 0 0 1 2-2h2a5 5 0 0 1 5 2 5 5 0 0 1 5-2h2a2 2 0 0 1 2 2v13h-4a5 5 0 0 0-5 3 5 5 0 0 0-5-3H3Z"/></svg>
                    <span class="nav-label">Minhas turmas</span>
                </a>

                <a href="meuperfil.html" class="active" aria-label="Meu perfil" title="Meu perfil">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    <span class="nav-label">Meu perfil</span>
                </a>

                <a href="index.html" aria-label="Sair" title="Sair">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
                    <span class="nav-label">Sair</span>
                </a>

            </nav>

            <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Recolher menu" title="Recolher menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                <span class="toggle-label">Recolher menu</span>
            </button>

            <!-- Usuário -->
            <div class="professor">

                <div class="profile-icon" id="foto-lateral">
                    <span>P</span>
                </div>

                <div>
                    <strong id="nomeLateral">Professor</strong>
                    <span>Professor(a)</span>
                </div>

            </div>

        </aside>


        <!-- =========================
             CONTEÚDO
        ========================== -->

        <main class="main-content">

            <header class="header">

                <div>
                    <h1>Meu perfil</h1>

                    <p>
                        Atualize sua foto e seus dados cadastrais
                    </p>
                </div>

            </header>


            <!-- =========================
                 CARD DO PERFIL
            ========================== -->

            <section class="perfil-card">

                <!-- FOTO -->

                <div class="foto-container">

                    <div class="foto" id="foto-perfil">
                        <span id="letraPerfil">P</span>
                    </div>

                    <label
                        for="foto-input"
                        class="alterar-foto">
                        Alterar foto
                    </label>

                    <input
                        type="file"
                        id="foto-input"
                        accept="image/png, image/jpeg"
                    >

                    <small>
                        PNG ou JPG
                    </small>

                </div>


                <!-- FORMULÁRIO -->

                <form class="form-perfil">

                    <div class="campo">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail institucional
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="disciplina">
                            Disciplina principal
                        </label>

                        <input
                            type="text"
                            id="disciplina"
                            name="disciplina"
                            placeholder="Digite sua disciplina"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-salvar">

                        Salvar alterações

                    </button>

                </form>

            </section>

        </main>

    </div>


    <script src="meuperfil.js"></script>
    <script src="sidebar-toggle.js"></script>

</body>

</html>
